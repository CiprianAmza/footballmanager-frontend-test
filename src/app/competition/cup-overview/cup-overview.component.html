<div class="cup-container" [class.compact]="!showRoundNavigation">
  
    <!-- ROUND NAVIGATOR -->
    <div class="round-header" *ngIf="showRoundNavigation && roundNames.length > 1">
      <button type="button" aria-label="Previous round" class="nav-btn" (click)="prevRound()" [disabled]="currentRoundIndex === 0">❮</button>
      
      <div class="round-title-box">
          <select aria-label="Cup round" class="round-name" [ngModel]="currentRoundIndex" (ngModelChange)="selectRound($event)">
            <option *ngFor="let name of roundNames; let index = index" [ngValue]="index">{{ name }}</option>
          </select>
          <!-- Afișăm numărul de meciuri doar dacă nu se încarcă -->
          <span class="match-count" *ngIf="!loading">{{ matches.length }} Fixtures</span>
          <span class="match-count" *ngIf="loading">Loading...</span>
      </div>
      
      <button type="button" aria-label="Next round" class="nav-btn" (click)="nextRound()" [disabled]="currentRoundIndex === roundNames.length - 1">❯</button>
    </div>
  
    <!-- LOADING SPINNER -->
    <div *ngIf="loading" class="loading-state">
        <div class="spinner"></div>
    </div>
  
    <!-- MATCHES GRID -->
    <div class="matches-grid" *ngIf="!loading">
      
      <div class="match-card" *ngFor="let match of matches">

          <!-- Home Team -->
          <div class="team home"
               [class.winner]="match.winner === 'home'"
               [class.loser]="match.winner === 'away'"
               [class.placeholder]="match.isPlaceholderHome">
              <a class="t-name" *ngIf="!match.isPlaceholderHome; else homePlaceholder" [routerLink]="['/team', match.team1Id]">{{ match.homeTeam }}</a>
              <ng-template #homePlaceholder><span class="t-name">{{ match.homeTeam }}</span></ng-template>
          </div>

          <!-- Score / VS -->
          <div class="score-badge">
              <a *ngIf="match.score !== '-' && match.team1Id && match.team2Id" class="score"
                 [routerLink]="['/match-report2', competitionId, season, match.round, match.team1Id, match.team2Id]"
                 [attr.aria-label]="'Match report: ' + match.homeTeam + ' ' + match.score + ' ' + match.awayTeam">{{ match.score }}</a>
              <span *ngIf="match.score === '-'" class="vs">V</span>
              <small *ngIf="match.decision" class="decision">{{ match.decision }}</small>
          </div>

          <!-- Away Team -->
          <div class="team away"
               [class.winner]="match.winner === 'away'"
               [class.loser]="match.winner === 'home'"
               [class.placeholder]="match.isPlaceholderAway">
              <a class="t-name" *ngIf="!match.isPlaceholderAway; else awayPlaceholder" [routerLink]="['/team', match.team2Id]">{{ match.awayTeam }}</a>
              <ng-template #awayPlaceholder><span class="t-name">{{ match.awayTeam }}</span></ng-template>
          </div>

      </div>
  
      <!-- Empty State -->
      <div *ngIf="matches.length === 0 && !loading" class="no-matches">
          <ng-container *ngIf="failed; else noFixtures">The bracket is unavailable. <button type="button" (click)="loadBracket()">Try again</button></ng-container>
          <ng-template #noFixtures>No fixtures scheduled{{ currentRoundName ? ' for ' + currentRoundName : '' }}.</ng-template>
      </div>
  
    </div>
  
    <!-- INFO FOOTER -->
    <div class="round-footer" *ngIf="matches.length > 0">
        <div class="info-text">{{ currentRoundName }}</div>
    </div>
  
  </div>
