<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FrontendFootballmanager</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      var allowed = ['classic', 'dark', 'light', 'retro', 'medieval', 'matrix', 'disco', 'boho', 'nature', 'ocean', 'space-galaxy', 'halloween', 'christmas', 'harry-potter'];
      var saved = null;
      try { saved = localStorage.getItem('fm.ui-theme.v1'); } catch (_) {}
      var theme = allowed.indexOf(saved) >= 0 ? saved : 'classic';
      document.documentElement.setAttribute('data-fm-theme', theme);
      document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark';
    }());
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
